          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldDeclaration'
          description: |-
            How each Field's Series reads on the Correlation page, keyed by Field name. Metadata,
            never versioned schema: setting one mints no TrackerVersion, and it applies when
            reading Entries pinned to any Version. See ADR 0017.
      description: |-
        A Tracker's header: identity, metadata, and its current place in its own version
        history. The Field schema itself lives on `TrackerVersion`, not here. See ADR 0005.
