          type: string
          description: Client-generated UUID.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when soft-deleted; default reads exclude these rows.
          readOnly: true
        revision:
          type: integer
          format: int32
          description: Monotonic per-record counter for conflict detection.
          readOnly: true
        ownerId:
          type: string
          readOnly: true
        userId:
          type: string
          readOnly: true
        trackerId:
          type: string
        version:
          type: integer
          format: int32
          description: Sequential per Tracker, starting at 1.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDef'
      description: |-
        An immutable, sequentially numbered snapshot of a Tracker's Field schema. Never
        updated or deleted — an Entry's Snapshot pins to one of these forever. See ADR 0005.
