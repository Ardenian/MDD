<a class="skip-link" href="#main-content" data-testid="skip-link">{{ 'app.skipToContent' | translate }}</a>

<header class="app-header">
  <span class="app-header__title" data-testid="app-title">{{ 'app.title' | translate }}</span>

  <nav class="app-nav" [attr.aria-label]="'app.nav.label' | translate" data-testid="app-nav">
    <ul class="app-nav__list">
      @for (item of navigation; track item.path) {
        <li>
          <a
            class="app-nav__link"
            [routerLink]="item.path"
            routerLinkActive="app-nav__link--active"
            ariaCurrentWhenActive="page"
            [attr.data-testid]="item.path"
          >
            {{ item.labelKey | translate }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <label class="app-header__locale">
    <span>{{ 'languageSwitcher.label' | translate }}</span>
    <select
      data-testid="locale-select"
      [value]="uiLocale.uiLocale()"
      (change)="onLocaleChange($event)"
    >
      @for (locale of supportedLocales; track locale) {
        <option [value]="locale">{{ locale }}</option>
      }
    </select>
  </label>
</header>

<main class="app-main" id="main-content" tabindex="-1" data-testid="main-content">
  <router-outlet />
</main>

<ui-toast-list [toasts]="toasts()" [dismissLabel]="'toast.dismiss' | translate" (dismissed)="dismissToast($event)" />
